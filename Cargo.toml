[workspace]
resolver = "3"
members = [
    "crates/cli",
    "crates/core",
    "crates/plugins/*",
    "crates/plugin-sdk",
    "crates/runtime",
    "crates/source-alloy",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/abhi3700/raven"
rust-version = "1.91"

[workspace.dependencies]
alloy = { version = "2.1", features = [
    "consensus",
    "network",
    "providers",
    "provider-http",
    "provider-ws",
    "rpc-types",
    "reqwest",
] }
alloy-primitives = { version = "1.6.1", features = ["serde"] }
alloy-sol-types = "1.6.0"
eyre = "0.6.14"
async-trait = "0.1.92"
clap = { version = "4.6.6", features = ["derive", "env"] }
colored = "3.1.1"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time"
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
