[workspace]
resolver = "3"
members = [
    "crates/raven-cli",
    "crates/raven-core",
    "crates/raven-plugin-sdk",
    "crates/raven-runtime",
    "crates/raven-source-alloy",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/abhi3700/raven"
rust-version = "1.91"

[workspace.dependencies]
alloy = { version = "2.1", features = [
    "consensus",
    "network",
    "providers",
    "provider-http",
    "provider-ws",
    "rpc-types",
    "reqwest",
] }
eyre = "0.6.12"
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive", "env"] }
colored = "3.1.1"
futures-util = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time"
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
